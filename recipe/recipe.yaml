schema_version: 1

context:
  version: "3.5.0"

package:
  name: hol-guard
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hol-guard/hol_guard-${{ version }}.tar.gz
  sha256: 893d602f8c77d31c629cda884bde6c7f8d50ce72c310b6e97daadeb509373ed9

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - hol-guard = codex_plugin_scanner.cli:main
      - plugin-guard = codex_plugin_scanner.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling <1.31
  run:
    - python >=${{ python_min }}
    - rich >=14.0,<15
    - cryptography >=50.0.0
    - keyring >=25.0
    - packaging >=24.0
    - idna ==3.15
    - jsonschema >=4.26.0
    - pyyaml >=6.0.3
    - regex >=2025.0.0,<2027
    - requests >=2.32,<3
    - publicsuffixlist ==1.0.2.20260726
    - tomli >=2.0
    - mcp >=1.28.1,<2

tests:
  - python:
      imports:
        - codex_plugin_scanner
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - hol-guard --version
      - hol-guard --help

about:
  homepage: https://hol.org/guard
  summary: Open-source antivirus and runtime protection for AI agents
  description: |
    HOL Guard reviews supported AI-agent actions before they run, including
    shell commands, file access, package installs, and MCP tool calls. It can
    allow, block, or request approval according to local policy and keeps
    receipts for later review.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://github.com/hashgraph-online/hol-guard/tree/main/docs/guard
  repository: https://github.com/hashgraph-online/hol-guard

extra:
  recipe-maintainers:
    - kantorcodes
